name: Release

on:
  push:
    branches:
      - "master"
    paths:
      - "CHANGELOG.md"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      output: "${{ github.workspace }}/build/app/outputs/apk/release"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get App Version
        id: app_version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -n1 | awk '{print $2}' || echo "1.0.0+1")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            ~/go/pkg/mod
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/go.sum', '**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Download AList Source Code
        run: |
          cd $GITHUB_WORKSPACE/alist-lib/scripts
          chmod +x *.sh
          ./init_alist.sh
          ./init_web.sh

      - uses: actions/setup-go@v5
        with:
          go-version: 1.22
          cache-dependency-path: ${{ github.workspace }}/alist-lib/alist/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            notifications
            .setup-gradle

      - name: Build AList
        run: |
          cd $GITHUB_WORKSPACE/alist-lib/scripts
          chmod +x *.sh
          ./init_gomobile.sh
          ./gobind.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GO111MODULE: "on"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: "AList-${{ steps.app_version.outputs.version }}"
          path: "${{ github.workspace }}/android/app/libs/*.aar"

      - name: Init Signature
        run: |
          touch local.properties
          cd android
          echo ALIAS_NAME='${{ secrets.ALIAS_NAME }}' >> local.properties
          echo ALIAS_PASSWORD='${{ secrets.ALIAS_PASSWORD }}' >> local.properties
          echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo KEY_PATH='./key.jks' >> local.properties
          # 从Secrets读取无换行符Base64解码, 然后保存到到app/key.jks
          echo ${{ secrets.KEY_STORE }} | base64 --decode > $GITHUB_WORKSPACE/android/app/key.jks

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk \
            --split-per-abi \
            --release \
            --no-pub \
            --build-name=$(echo ${{ steps.app_version.outputs.version }} | cut -d+ -f1) \
            --build-number=$(echo ${{ steps.app_version.outputs.version }} | cut -d+ -f2)

      - name: Upload missing_rules.txt
        if: failure() && steps.gradle.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: "missing_rules-${{ github.run_number }}"
          path: "${{ github.workspace }}/build/app/outputs/mapping/release/missing_rules.txt"

      - name: Init APP Version Name
        run: |
          if [ -z "${{ env.ver_name }}" ]; then
            if [ -f "${{ env.output }}/output-metadata.json" ]; then
              echo "ver_name=$(grep -m 1 'versionName' ${{ env.output }}/output-metadata.json | cut -d\" -f4)" >> $GITHUB_ENV
            else
              echo "ver_name=${{ steps.app_version.outputs.version }}" >> $GITHUB_ENV
            fi
          fi

      - uses: softprops/action-gh-release@v1
        with:
          name: ${{ env.ver_name }}
          tag_name: ${{ env.ver_name }}
          body_path: ${{ github.workspace }}/CHANGELOG.md
          draft: false
          prerelease: false
          files: ${{ env.output }}/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
